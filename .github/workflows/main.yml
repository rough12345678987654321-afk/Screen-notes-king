name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q *.zip -d proj
      - name: Apply fixes
        run: |
          sed -i 's|Card(Modifier.fillMaxWidth(), onClick = { onOpen(n.id) })|Card(onClick = { onOpen(n.id) }, modifier = Modifier.fillMaxWidth())|' proj/ScreenNotes/app/src/main/java/com/example/screennotes/MainActivity.kt
          sed -i 's|gemini-2.5-flash|gemini-3.8-flash|' proj/ScreenNotes/app/src/main/java/com/example/screennotes/Gemini.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: proj/ScreenNotes
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenNotes-apk
          path: proj/ScreenNotes/app/build/outputs/apk/debug/app-debug.apk
