name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ScreenNotes/**"
      - ".github/workflows/main.yml"
  # Check that pull requests still build (no release is published for these).
  pull_request:
    paths:
      - "ScreenNotes/**"
      - ".github/workflows/main.yml"
      - ".github/scripts/gradle_errors.py"

permissions:
  contents: write # needed to publish the APK as a GitHub release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        working-directory: ScreenNotes
        env:
          # Baked into the app so its Updates tab knows exactly which build is installed.
          APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_BUILD_LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          APP_BUILD_TIME="$(date +%s)000"
          export APP_BUILD_TIME
          gradle assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk ../ScreenNotes.apk

      # Turns compiler errors into clear annotations (shown on the run page and in pull requests).
      - name: Show build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/gradle_errors.py "$RUNNER_TEMP/gradle.log"

      # The APK itself (not zipped): download it from the run page and open it on your device.
      - uses: actions/upload-artifact@v7
        with:
          path: ScreenNotes.apk
          archive: false

      # Builds of main are also published as the "Latest" GitHub release. The app's Updates tab
      # offers it as "New version available", and anyone can download it from the Releases page
      # without logging in.
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          {
            echo "Automatic build of \`main\`."
            echo
            if [ -n "${COMMIT_MSG:-}" ]; then echo "**Latest change:** ${COMMIT_MSG%%$'\n'*}"; echo; fi
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Install: download **ScreenNotes.apk** below on your phone/tablet and open it,"
            echo "or tap **Install** in the app's Updates tab."
          } > notes.md
          gh release create "$TAG" ScreenNotes.apk \
            --target "$GITHUB_SHA" \
            --title "Screen Notes (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --latest
          # Keep only the 3 newest main builds (test builds from AI updates are separate pre-releases).
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease | not) | .tagName' \
            | grep -E '^build-[0-9]+$' | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done
